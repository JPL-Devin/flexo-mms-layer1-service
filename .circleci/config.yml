version: 2.1
orbs:
  docker: circleci/docker@2.1.1
  node: circleci/node@5.0.2
  sonarcloud: sonarsource/sonarcloud@4.0.0
jobs:
  generate_schema:
    executor:
      name: node/default
    working_directory: /home/circleci/flexo-mms-layer1-service
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: deploy
      - run:
          name: Generate schema
          command: |
            cd deploy
            npx ts-node src/main.ts http://layer1-service > ../src/test/resources/cluster.trig
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - flexo-mms-layer1-service/*
  build_and_test:
    machine:
      image: default
    working_directory: /home/circleci/flexo-mms-layer1-service
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Cat out cluster.trig
          command: |
            cat src/test/resources/cluster.trig
      - run:
          name: Build stack and run tests
          shell: /bin/bash
          command: |
            docker compose -f src/test/resources/docker-compose.yml up -d --wait
            cp src/main/resources/application.conf.test ./src/main/resources/application.conf
            docker build -t flexo-mms-test:latest -f Dockerfile-Test .
            test_status=0
            docker run --network=flexo-mms-test-network --name flexo-mms-test-container flexo-mms-test:latest || test_status=$?
            docker cp flexo-mms-test-container:/application/build /home/circleci/flexo-mms-layer1-service/build
            exit "$test_status"
      - store_test_results:
          path: /home/circleci/flexo-mms-layer1-service/build/test-results/test
      - store_artifacts:
          path: /home/circleci/flexo-mms-layer1-service/build/reports/tests
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - flexo-mms-layer1-service/*
  scan:
    executor:
      name: docker/docker
    working_directory: /home/circleci/flexo-mms-layer1-service
    steps:
      - checkout
      - attach_workspace:
          at: ~/
      - run:
          name: Fetch full git history for SonarCloud blame
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow
            fi
      - sonarcloud/scan

  deploy_snapshot:
    executor:
      name: docker/docker
    working_directory: /home/circleci/flexo-mms-layer1-service
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
          version: default
      - attach_workspace:
          at: ~/
      - run:
          name: Login to Dockerhub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Create multi-arch builder
          command: |
            docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install arm64
            docker buildx create --name multiarch --use || docker buildx use multiarch
            docker buildx inspect --bootstrap
      - run:
          name: Build and push multi-arch docker image
          command: |
            cp src/main/resources/application.conf.example ./src/main/resources/application.conf
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t openmbee/flexo-mms-layer1-service:${CIRCLE_BRANCH#*/}-SNAPSHOT \
              --push .
  deploy_nightly:
    executor:
      name: docker/docker
    working_directory: /home/circleci/flexo-mms-layer1-service
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
          version: default
      - attach_workspace:
          at: ~/
      - checkout
      - run:
          name: Login to Dockerhub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Create multi-arch builder
          command: |
            docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install arm64
            docker buildx create --name multiarch --use || docker buildx use multiarch
            docker buildx inspect --bootstrap
      - run:
          name: Build and push multi-arch docker image
          command: |
            cp src/main/resources/application.conf.example ./src/main/resources/application.conf
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t openmbee/flexo-mms-layer1-service:NIGHTLY-SNAPSHOT \
              --push .
  deploy_release:
    executor:
      name: docker/docker
    working_directory: /home/circleci/flexo-mms-layer1-service
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
          version: default
      - attach_workspace:
          at: ~/
      - run:
          name: Login to Dockerhub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Create multi-arch builder
          command: |
            docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install arm64
            docker buildx create --name multiarch --use || docker buildx use multiarch
            docker buildx inspect --bootstrap
      - run:
          name: Build and push multi-arch release
          command: |
            cp src/main/resources/application.conf.example ./src/main/resources/application.conf
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t openmbee/flexo-mms-layer1-service:${CIRCLE_TAG} \
              -t openmbee/flexo-mms-layer1-service:latest \
              --push .

workflows:
  build-test-deploy:
    jobs:
      - scan:
          requires:
            - build_and_test
          filters:
            tags:
              only: /v[0-9.]+(-[\w-]+(\.[0-9]+)?)?/
          context:
            - SonarCloud
      - generate_schema:
          filters:
            tags:
              only: /v[0-9.]+(-[\w-]+(\.[0-9]+)?)?/
          context:
            - DockerHub
      - build_and_test:
          post-steps:
            - persist_to_workspace:
                root: /home/circleci/flexo-mms-layer1-service
                paths:
                  - build/*
          requires:
            - generate_schema
          filters:
            tags:
              only: /v[0-9.]+(-[\w-]+(\.[0-9]+)?)?/
          context:
            - DockerHub
      - deploy_snapshot:
          requires:
            - build_and_test
          filters:
            branches:
              only: /((release|hotfix|support)/[0-9.]+(-[\w-]+(\.[0-9]+)?)?|develop)/
          context:
            - DockerHub
      - deploy_release:
          requires:
            - build_and_test
          filters:
            tags:
              only: /v[0-9.]+(-[\w-]+(\.[0-9]+)?)?/
            branches:
              ignore: /.*/
          context:
            - DockerHub
