name: build-test-deploy

on:
  push:
    branches:
      - '**'            # run build & test on every branch push
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

jobs:
  # ---------------------------------------------------------------------------
  # 1. Generate the cluster.trig schema used by integration tests
  # ---------------------------------------------------------------------------
  generate_schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Install NPM dependencies
        run: npm ci
        working-directory: deploy

      - name: Generate schema
        run: npx ts-node src/main.ts http://layer1-service > ../src/test/resources/cluster.trig
        working-directory: deploy

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .

  # ---------------------------------------------------------------------------
  # 2. Build the application and run the integration-test suite
  # ---------------------------------------------------------------------------
  build_and_test:
    runs-on: ubuntu-latest
    needs: generate_schema
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Cat out cluster.trig
        run: cat src/test/resources/cluster.trig

      - name: Build stack and run tests
        shell: /bin/bash {0}
        run: |
          docker compose -f src/test/resources/docker-compose.yml up -d
          cp src/main/resources/application.conf.test ./src/main/resources/application.conf
          docker build -t flexo-mms-test:latest -f Dockerfile-Test .
          docker run --network=flexo-mms-test-network --name flexo-mms-test-container flexo-mms-test:latest
          SIG_INT=$?
          docker cp flexo-mms-test-container:/application/build ./build
          exit "$SIG_INT"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build

  # ---------------------------------------------------------------------------
  # 3. SonarCloud static-analysis scan
  # ---------------------------------------------------------------------------
  scan:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # 4. Deploy SNAPSHOT image to DockerHub
  #    Runs only on develop, release/*, hotfix/*, support/* branches
  # ---------------------------------------------------------------------------
  deploy_snapshot:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/hotfix/') ||
        startsWith(github.ref, 'refs/heads/support/')
      )
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build docker image
        run: |
          cp src/main/resources/application.conf.example ./src/main/resources/application.conf
          docker build -t openmbee/flexo-mms-layer1-service:latest .

      - name: Tag docker image
        run: |
          # For release/1.0, hotfix/1.0 etc. strip the prefix; for develop use it as-is
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SUFFIX="${BRANCH#*/}"
          docker tag openmbee/flexo-mms-layer1-service:latest "openmbee/flexo-mms-layer1-service:${BRANCH_SUFFIX}-SNAPSHOT"

      - name: Deploy snapshot to DockerHub
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SUFFIX="${BRANCH#*/}"
          docker push "openmbee/flexo-mms-layer1-service:${BRANCH_SUFFIX}-SNAPSHOT"

  # ---------------------------------------------------------------------------
  # 5. Deploy RELEASE image to DockerHub
  #    Runs only on v* tags
  # ---------------------------------------------------------------------------
  deploy_release:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build docker image
        run: |
          cp src/main/resources/application.conf.example ./src/main/resources/application.conf
          docker build -t openmbee/flexo-mms-layer1-service:latest .

      - name: Tag docker image
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          docker tag openmbee/flexo-mms-layer1-service:latest "openmbee/flexo-mms-layer1-service:${TAG}"

      - name: Deploy release to DockerHub
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          docker push "openmbee/flexo-mms-layer1-service:${TAG}"

      - name: Deploy release as latest to DockerHub
        run: docker push openmbee/flexo-mms-layer1-service:latest
